let cards=a.map((m,i)=>`<section class=card id=m${i}><h3>${i+1}. ${e(m[0])}</h3><div class=en>${e(m[1])}</div><pre class=mermaid>flowchart LR
${e(m[5])}</pre><div class=src>${e(m[2])}<br><a href="${e(m[4])}" target="_blank">${e(m[4])}</a></div></section>`).join('');
view.innerHTML=`<div class=head><div><h2>${cur}</h2><p>${ds[cur]}</p></div><span class=tag>Top 10 代表性模型</span></div><div class=note><b>研究註記：</b>本網站的 Top 10 係依經典影響力、研究使用頻率與構面關聯性整理，並非宣稱為 Scopus、Web of Science 或 Google Scholar 即時引用數精確排名。模型圖為便於研究比較之簡化 Mermaid 架構。</div><div class=wrap><table><thead><tr><th>序號</th><th>模型（中英名稱）</th><th>論文出處</th><th>年份</th><th>URL</th><th>模型圖</th></tr></thead><tbody>${rows}</tbody></table></div><div class=grid>${cards}</div>`;await mermaid.run({querySelector:'.mermaid'})}
window.setTheme=(p,p2)=>{document.documentElement.style.setProperty('--p',p);document.documentElement.style.setProperty('--p2',p2);localStorage.setItem('tech-theme',JSON.stringify([p,p2]))};try{let t=JSON.parse(localStorage.getItem('tech-theme'));if(t)setTheme(...t)}catch(e){}
menus();render();
</script></body></html>
